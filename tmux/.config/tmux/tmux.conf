# Set true colour
set-option -sa terminal-overrides ',xterm*:Tc'
set-option -sa terminal-features ',xterm-kitty:RGB'

# Set prefix
unbind C-b 
set -g prefix C-Space
bind C-space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Index window panes at 1 not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Automatically renumber windows when one is deleted
set-option -g renumber-windows on

# Set status bar position
set -g status-position top

# Open panes in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Enable mouse actions such as drag pane
set -g mouse on

# yazi image preview fix
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# LACKLUSTER THEME BEGIN
color_lack="#708090"
color_luster="#deeeed"
color_orange="#ffaa88"
color_green="#789978"
color_blue="#7788AA"
color_red="#D70000"
color_black="#000000"
color_gray1="#080808"
color_gray2="#191919"
color_gray3="#2a2a2a"
color_gray4="#444444"
color_gray5="#555555"
color_gray6="#7a7a7a"
color_gray7="#aaaaaa"
color_gray8="#cccccc"
color_gray9="#DDDDDD"
# pill accent — matches neovim's Normal bg/fg (custom/colorschemes/quiet.lua)
color_pill="#b6b5b2"
color_pill_text="#262522"

# by default window names will just be their index
set-option -g automatic-rename              on
set-option -g automatic-rename-format       "#{pane_current_path}"
set-option -g clock-mode-style              24 
set-option -g status-fg                     "$color_luster"
set-option -g status-style		            "bg=$color_black"
set-option -g copy-mode-current-match-style "fg=$color_gray1,bg=$color_gray8"
set-option -g copy-mode-match-style         "fg=$color_gray1,bg=$color_gray8"
set-option -g menu-selected-style           "fg=$color_gray1,bg=$color_luster"
set-option -g menu-style                    "fg=$color_luster,bg=$color_gray1"
set-option -g message-style		            "bg=$color_gray8,fg=$color_gray1"
set-option -g message-command-style         "bg=$color_green,fg=$color_gray1"
set-option -g mode-style                    "bg=$color_gray8,fg=$color_gray1"
set-option -g pane-border-lines             "single"
set-option -g pane-border-style             "fg=$color_gray2"
set-option -g pane-active-border-style      "fg=$color_gray2"
set-option -g popup-border-lines            "rounded"
set-option -g window-status-current-style   "fg=#949494"
set-option -g window-status-style           "fg=#535353"

set-option -g default-shell /opt/homebrew/bin/fish
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# display the window index number or index-number:name if has a name
set-option -g window-status-format         '#(printf "\xef\x86\xb2") #W'
# active window rendered as a flat filled chip; index number omitted since
# the tab's position already shows which window it is
set-option -g window-status-current-format "#[fg=$color_pill_text,bg=$color_pill] #(printf '\\xef\\x86\\xb2') #W #[default]"

# status right will show the time in 24 hour format and if there is more than one
# server session the current session name will be there too
# icons - https://www.nerdfonts.com/cheat-sheet
set-option -g status-right '#{?#{>:#{server_sessions},1},#(printf "") #{session_name},}  #[fg=#{color_gray6}]#(printf "") %a %d %b %H:%M  #[fg=#{color_gray6}]#(~/.config/tmux/scripts/battery.sh "#{color_orange}" "#{color_red}") '
# set-option -g status-right '#{?#{>:#{server_sessions},1},#(printf "") #{session_name},}  #[fg=#{color_gray6}]#(printf "") %a %d %b %I:%M%p  #[fg=#{color_gray6}]#(~/.config/tmux/scripts/battery.sh "#{color_orange}" "#{color_red}") '
set -g status-right-length 200
set-option -g status-left ' '

# tmux has no top-padding option for the status bar, so fake it with a second
# status line: slot 0 (blank) sits nearest the panes and acts as the padding,
# slot 1 holds the real bar (mirrors tmux's own default status-format[0]) and
# sits nearest the terminal edge.
set-option -g status 2
set-option -g status-format[0] ''
set-option -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# LACKLUSTER THEME END

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
