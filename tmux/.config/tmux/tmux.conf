# Set true colour
set-option -sa terminal-overrides ',xterm*:Tc'
set-option -sa terminal-features ',xterm-kitty:RGB'

# Set prefix
unbind C-b 
set -g prefix C-Space
bind C-space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Index window panes at 1 not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Automatically renumber windows when one is deleted
set-option -g renumber-windows on

# Set status bar position
set -g status-position top

# Open panes in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Enable mouse actions such as drag pane
set -g mouse on

# yazi image preview fix
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# LACKLUSTER THEME BEGIN
color_lack="#708090"
color_luster="#deeeed"
color_orange="#ffaa88"
color_green="#789978"
color_blue="#7788AA"
color_red="#D70000"
color_black="#000000"
color_gray1="#080808"
color_gray2="#191919"
color_gray3="#2a2a2a"
color_gray4="#444444"
color_gray5="#555555"
color_gray6="#7a7a7a"
color_gray7="#aaaaaa"
color_gray8="#cccccc"
color_gray9="#DDDDDD"
# pill accent — Zenburn's bright blue (ansi 12), echoing herdr's own blue
# accent pill (herdr/.config/herdr/config.toml's [ui] accent); pill text is
# Zenburn's actual background (#3f3f3f) for dark-on-light contrast, same
# polarity the old quiet-matched pill used.
color_pill="#94bff3"
color_pill_text="#3f3f3f"
# Rounded pill corners: tmux renders the status line on a fixed
# character grid, so a plain bg= fill is always hard-edged -- no
# amount of colour shading (tried above, reverted) can curve a pixel
# that isn't there. Genuine rounding needs the nerd font's Powerline
# Extra half-circle glyphs (U+E0B6/U+E0B4), purpose-built for exactly
# this: fg=$color_pill on the terminal's own bg draws a colour-pill-
# shaped bump that reads as a rounded cap either side of the flat body.

# by default window names will just be their index
set-option -g automatic-rename              on
set-option -g automatic-rename-format       "#{pane_current_path}"
set-option -g clock-mode-style              24 
set-option -g status-fg                     "$color_luster"
set-option -g status-style                  "bg=default"
set-option -g copy-mode-current-match-style "fg=$color_gray1,bg=$color_gray8"
set-option -g copy-mode-match-style         "fg=$color_gray1,bg=$color_gray8"
set-option -g menu-selected-style           "fg=$color_gray1,bg=$color_luster"
set-option -g menu-style                    "fg=$color_luster,bg=$color_gray1"
set-option -g message-style		            "bg=$color_gray8,fg=$color_gray1"
set-option -g message-command-style         "bg=$color_green,fg=$color_gray1"
set-option -g mode-style                    "bg=$color_gray8,fg=$color_gray1"
set-option -g pane-border-lines             "single"
set-option -g pane-border-style             "fg=$color_gray2"
set-option -g pane-active-border-style      "fg=$color_gray2"
set-option -g popup-border-lines            "rounded"
set-option -g window-status-current-style   "fg=#949494"
set-option -g window-status-style           "fg=#535353"

# set-option -g default-shell /opt/homebrew/bin/fish
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# display the window index number or index-number:name if has a name
set-option -g window-status-format         '#(printf "\xef\x86\xb2") #W'
# active window rendered as a rounded pill; index number omitted since
# the tab's position already shows which window it is. The half-circle
# caps sit outside the #[bg=$color_pill] span (fg=$color_pill,bg=default)
# so they blend into the real terminal background on either side rather
# than sitting on a second colour -- bg=default has to be set explicitly
# on BOTH caps: the pill body between them leaves bg=$color_pill active,
# and without resetting it the trailing cap renders pill-on-pill (same
# fg/bg), invisible even though the glyph itself is correctly there.
set-option -g window-status-current-format "#[fg=$color_pill,bg=default]#(printf '\\xee\\x82\\xb6')#[fg=$color_pill_text,bg=$color_pill] #(printf '\\xef\\x86\\xb2') #W #[fg=$color_pill,bg=default]#(printf '\\xee\\x82\\xb4')#[default]"

# status right always shows the current session name, then the time in
# 24 hour format
# icons - https://www.nerdfonts.com/cheat-sheet
set-option -g status-right '#(printf "") #{session_name}  #[fg=#{color_gray6}]#(printf "") %a %d %b %H:%M  #[fg=#{color_gray6}]#(~/.config/tmux/scripts/battery.sh "#{color_orange}" "#{color_red}") '
# set-option -g status-right '#(printf "") #{session_name}  #[fg=#{color_gray6}]#(printf "") %a %d %b %I:%M%p  #[fg=#{color_gray6}]#(~/.config/tmux/scripts/battery.sh "#{color_orange}" "#{color_red}") '
set -g status-right-length 200
set-option -g status-left ' '

# tmux has no top/bottom-padding option for the status bar, so fake it
# with blank status-format[] rows. Confirmed empirically (captured raw
# pty output over a real attached client): rows render in ASCENDING
# index order top-to-bottom, i.e. status-format[0] is nearest the
# terminal edge and higher indices move DOWN toward the panes — the
# opposite of what an earlier version of this comment claimed.
#   [0] blank — margin between the terminal edge and the bar
#   [1] the real bar (window list + status-right)
#   [2] blank — breathing room between the bar and the panes/prompt
#
# status must match the number of status-format[] entries actually
# defined below — a higher value leaves later slots undefined, and tmux
# fills those with its own built-in default line (a session list, as
# seen when status was 3 with only [0]/[1] defined) instead of leaving
# them blank. To add more height, add another explicitly-blank slot
# (and bump `status` to match) rather than raising `status` alone.
set-option -g status 3
set-option -g status-format[0] ''
set-option -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set-option -g status-format[2] ''

# LACKLUSTER THEME END

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
